[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-control-atlas"
version = "0.1.0"
description = "Cited retrieval over public NIST and CISA catalogs on Pinecone Starter."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Brian Martin" }]
dependencies = [
  "httpx>=0.27",
  "pinecone>=7.0",
  "python-dotenv>=1.0",
  "typing_extensions>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
